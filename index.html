<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="panel" aria-labelledby="app-title">
      <div class="title-group">
        <div>
          <p class="eyebrow">Web Development Project</p>
          <h1 id="app-title">Password Generator</h1>
        </div>
        <div class="logo" aria-hidden="true">PG</div>
      </div>

      <p class="intro">Create a strong password in seconds with custom length and character choices.</p>

      <div class="badges" aria-label="Project highlights">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
      </div>

      <div class="password-box">
        <input id="passwordOutput" type="text" value="" placeholder="Click generate" readonly>
        <button id="copyBtn" type="button">Copy</button>
      </div>

      <p id="message" class="message">Choose your options and generate a secure password.</p>

      <div class="control">
        <div class="control-row">
          <label for="lengthInput">Password Length</label>
          <span id="lengthValue">12</span>
        </div>
        <input id="lengthInput" type="range" min="4" max="32" value="12">
      </div>

      <fieldset class="options">
        <legend>Include Characters</legend>

        <label class="option">
          <input id="uppercase" type="checkbox" checked>
          <span>
            <strong>Uppercase</strong>
            <small>A B C</small>
          </span>
        </label>

        <label class="option">
          <input id="lowercase" type="checkbox" checked>
          <span>
            <strong>Lowercase</strong>
            <small>a b c</small>
          </span>
        </label>

        <label class="option">
          <input id="numbers" type="checkbox" checked>
          <span>
            <strong>Numbers</strong>
            <small>1 2 3</small>
          </span>
        </label>

        <label class="option">
          <input id="symbols" type="checkbox" checked>
          <span>
            <strong>Symbols</strong>
            <small>@ # $</small>
          </span>
        </label>
      </fieldset>

      <div class="strength">
        <div class="strength-info">
          <span>Strength</span>
          <strong id="strengthText">Strong</strong>
        </div>
        <div class="strength-bar" aria-hidden="true">
          <span id="strengthFill"></span>
        </div>
      </div>

      <button id="generateBtn" class="generate-btn" type="button">Generate Password</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
